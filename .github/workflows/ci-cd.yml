name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # Job 1: 后端测试 (MySQL 8.0)
  # ==========================================
  test-backend:
    runs-on: ubuntu-latest
    name: 后端自动化测试
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123456
          MYSQL_DATABASE: outsourcing_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptest123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 等待 MySQL 就绪
        run: |
          for i in {1..30}; do
            if mysql -h127.0.0.1 -uroot -ptest123456 -e "SELECT 1;" > /dev/null 2>&1; then
              echo "MySQL is ready!"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 1
          done
          echo "MySQL failed to start"
          exit 1
      
      - name: 运行 pytest 测试
        run: |
          pytest backend/tests/ -v --tb=short
        env:
          DATABASE_URL: mysql+pymysql://root:test123456@127.0.0.1:3306/outsourcing_test
          SECRET_KEY: github-ci-test-secret-key-${{ github.run_id }}

  # ==========================================
  # Job 2: 前端构建检查
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    name: 前端构建检查
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: 安装依赖
        run: |
          cd frontend
          npm ci --registry=https://registry.npmmirror.com
      
      - name: 构建前端
        run: |
          cd frontend
          npm run build

  # ==========================================
  # Job 3: 构建并推送 Docker 镜像 (仅 main 分支)
  # ==========================================
  build-and-push-images:
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    name: 构建并推送 Docker 镜像
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 提取镜像元数据 (后端)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest
      
      - name: 提取镜像元数据 (前端)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest
      
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
      
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
      
      - name: 输出镜像地址
        run: |
          echo "✅ 后端镜像: ${{ steps.meta-backend.outputs.tags }}"
          echo "✅ 前端镜像: ${{ steps.meta-frontend.outputs.tags }}"
