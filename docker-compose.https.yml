services:
  frontend-https:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped
